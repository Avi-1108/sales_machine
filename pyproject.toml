[project]
name = "sales-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Avi-1108", email = "avi123aish@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.125.0",
    "bcrypt>=5.0.0",
    "matplotlib>=3.9.4",
    "mysql-connector-python>=9.4.0",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.0",
    "plotly>=7.1.0",
    "reportlab>=5.1.0",
    "streamlit>=1.36",
    "xlrd>=2.0.2",
]

[project.scripts]
sales-machine = "sales_machine:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
